<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Heroes Battle</title>
    <link rel="stylesheet" href="static/styles.css">
    <style>
        body {
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: #f0f0f0;
            font-family: 'Roboto', 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 5px #000;
            margin: 30px 0;
        }

        h2 {
            font-size: 1.5rem;
            text-shadow: 1px 1px 3px #000;
            margin-bottom: 15px;
        }

        h3 {
            font-size: 1.2rem;
            margin-top: 10px;
            position: relative;
            top: -100px;
        }

        #hero-stats, #enemy-stats {
            margin-right: auto;
            margin-left: 50px;
        }

        #heroes-list, #enemies-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            height: 150px; /* Fixed height for consistent layout */
            overflow: hidden; /* Prevent overflow if content exceeds height */
        }

        #heroes-list li, #enemies-list li {
            font-size: 1rem;
            padding: 8px;
            margin: 3px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            box-shadow: 2px 2px 5px #000;
        }

        #actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px; /* Reduced margin to raise section higher */
            position: relative;
            top: -20px; /* Adjusted top positioning to raise section */
            height: 150px; /* Locked height */
            justify-content: space-evenly; /* Space out items evenly */
        }

        #action-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 1.2rem;
            color: #fff;
            background-color: #e94560;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 2px 2px 6px #000;
        }

        button:hover {
            background-color: #ff306a;
            transform: translateY(-2px);
        }

        select {
            padding: 10px;
            font-size: 1rem;
            border-radius: 5px;
            margin: 5px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            box-shadow: 2px 2px 6px #000;
            text-align: center;
        }

        #battle-status {
            font-size: 1rem;
            margin-top: 5px; /* Adjusted to add space */
            padding: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            box-shadow: 2px 2px 5px #000;
            width: 90%;
            max-width: 550px;
            text-align: center;
            position: relative;
            top: 0; /* Removed the negative offset */
        }

        .home-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #e94560;
            color: #fff;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 5px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .home-button:hover {
            background-color: #ff306a;
            transform: scale(1.05);
        }

        .home-button:active {
            transform: scale(1);
            box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <!-- Home Button -->
    <a href="/" class="home-button">Home</a>

    <h1>Marvel Heroes Adventure</h1>

    <!-- Updated battle status section -->
    <p id="battle-status">Ultron, Hela, and Loki are wreaking havoc across the city! Choose your hero to face them in battle!</p>

    <div id="hero-stats">
        <h2>Your Heroes</h2>
        <ul id="heroes-list">
            <!-- Heroes will be dynamically populated -->
        </ul>
    </div>

    <div id="enemy-stats">
        <h2>Enemies</h2>
        <ul id="enemies-list">
            <!-- Enemies will be dynamically populated -->
        </ul>
    </div>

    <div id="actions">
        <div id="action-controls">
            <select id="hero-select" onchange="updateBattleStatus()">
                <!-- Hero options will be dynamically populated -->
            </select>

            <span>is attacking</span>

            <select id="enemy-select" onchange="updateBattleStatus()">
                <!-- Enemy options will be dynamically populated -->
            </select>
        </div>
        <button onclick="performAction('attack')">Attack</button>
        <button onclick="performAction('special')">Use Special Move</button>
    </div>

    <script src="static/script.js"></script>
</body>
</html>
