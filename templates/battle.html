<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Heroes Adventure</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        /* Global Styles */
        body {
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: #f0f0f0;
            font-family: 'Roboto', 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        h1, h2, h3 {
            text-shadow: 2px 2px 5px #000;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        h3 {
            font-size: 1.4rem;
            margin-top: 20px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            font-size: 1rem;
            padding: 8px;
            margin: 5px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            box-shadow: 2px 2px 5px #000;
        }

        button {
            padding: 12px 25px;
            font-size: 1.2rem;
            color: #fff;
            background-color: #e94560;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 2px 2px 6px #000;
        }

        button:hover {
            background-color: #ff306a;
            transform: translateY(-2px);
        }

        #battle-status {
            font-size: 1rem;
            margin-top: 15px;
            padding: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            box-shadow: 2px 2px 5px #000;
            width: 80%;
            max-width: 400px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Marvel Heroes Adventure</h1>

    <!-- User Progress Section -->
    <div id="progress">
        <h3>Your Progress</h3>
        <p id="user-progress">Loading...</p>
    </div>

    <!-- Save Progress Button -->
    <button id="save-progress">Save Progress</button>

    <!-- Hero Stats -->
    <div id="hero-stats">
        <h2>Your Heroes</h2>
        <ul id="heroes-list"></ul>
    </div>

    <!-- Enemy Stats -->
    <div id="enemy-stats">
        <h2>Enemies</h2>
        <ul id="enemies-list"></ul>
    </div>

    <!-- Action Buttons -->
    <div id="actions">
        <button onclick="performAction('attack')">Attack</button>
        <button onclick="performAction('special')">Use Special Move</button>
    </div>

    <!-- Battle Status -->
    <h3>Battle Status</h3>
    <p id="battle-status"></p>

    <script>
        // Fetch and display user progress
        fetch('/game')
            .then(res => res.json())
            .then(data => {
                document.getElementById('user-progress').textContent = JSON.stringify(data.progress, null, 2);
            });

        // Save progress when the button is clicked
        document.getElementById("save-progress").onclick = function () {
            fetch("/save", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ progress: { heroes: "current", enemies: "current" } }) // Replace with actual progress data
            }).then(res => {
                if (res.ok) alert("Progress saved!");
            });
        };

        // Fetch and display heroes and enemies
        function startBattle() {
            fetch('/get_characters')
                .then(res => res.json())
                .then(data => {
                    const heroesList = document.getElementById('heroes-list');
                    heroesList.innerHTML = '';
                    data.forEach(hero => {
                        const li = document.createElement('li');
                        li.textContent = `${hero.name} - HP: ${hero.health}`;
                        heroesList.appendChild(li);
                    });
                });

            // Dynamically add enemies (logic can be updated as needed)
            const enemiesList = document.getElementById('enemies-list');
            enemiesList.innerHTML = '';
            const enemies = [
                { name: 'Loki', health: 100 },
                { name: 'Ultron', health: 150 }
            ]; // Example enemies; replace with dynamic fetch if needed
            enemies.forEach(enemy => {
                const li = document.createElement('li');
                li.textContent = `${enemy.name} - HP: ${enemy.health}`;
                enemiesList.appendChild(li);
            });
        }

        // Perform actions (attack or special move)
        function performAction(action) {
            fetch('/attack', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ character: "Iron Man", attack_type: action }) // Replace with dynamic data
            })
                .then(res => res.json())
                .then(data => {
                    document.getElementById('battle-status').textContent = data.message;
                    startBattle(); // Refresh stats
                });
        }

        // Initialize battle on page load
        window.onload = startBattle;
    </script>
</body>
</html>
