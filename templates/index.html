<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Heroes Adventure</title>
    <style>
        /* Global Styling */
        body {
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: #f0f0f0;
            font-family: 'Roboto', 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 10px #000;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.5rem;
            color: #fff;
            background-color: #e94560;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 3px 3px 10px #000;
            transition: background-color 0.3s, transform 0.3s;
            margin-top: 20px;
        }

        button:hover {
            background-color: #ff306a;
            transform: translateY(-5px);
        }

        button:active {
            transform: translateY(-2px);
            box-shadow: 1px 1px 5px #000;
        }

        #welcome-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 3px #000;
        }
    </style>
</head>

<body>
    <h1>Welcome to Marvel Heroes Adventure!</h1>

    <div id="welcome-text">
        <p>Your journey awaits. Sign in to track your progress or dive straight into the battle!</p>
    </div>

    <!-- Buttons -->
    <button onclick="window.location.href='/login'">Sign In with Google</button>
    <button onclick="window.location.href='/battle'">Enter the Arena</button>
</body>

</html>
